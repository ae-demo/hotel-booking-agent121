openapi: 3.0.3
info:
  title: Hotel Booking API
  version: 0.1.0
  description: Hotel/room catalog search, and the caller's own bookings.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            hotels:search: Search hotels and rooms
            bookings:create: Book and pay for a room
            bookings:read: The caller's own bookings
            bookings:cancel: Cancel one of the caller's own bookings
  schemas:
    Hotel:
      type: object
      required: [id, name, city, rating]
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        rating: { type: number, format: float }
    Room:
      type: object
      required: [id, hotelId, type, capacity, pricePerNight]
      properties:
        id: { type: string }
        hotelId: { type: string }
        type: { type: string, description: room type, e.g. double, suite }
        capacity: { type: integer }
        pricePerNight: { type: number, format: float }
        available: { type: boolean }
    Booking:
      type: object
      required: [id, roomId, checkInDate, checkOutDate, status, totalAmount]
      properties:
        id: { type: string }
        roomId: { type: string }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        status: { type: string, enum: [confirmed, cancelled] }
        totalAmount: { type: number, format: float }
        paymentRef: { type: string }
    NewBooking:
      type: object
      required: [roomId, checkInDate, checkOutDate]
      properties:
        roomId: { type: string }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
paths:
  /hotels:
    get:
      operationId: searchHotels
      summary: Search hotels by destination, dates and preferences — every matching hotel
      security:
        - oauth2: [hotels:search]
      parameters:
        - name: destination
          in: query
          schema: { type: string }
        - name: checkInDate
          in: query
          schema: { type: string, format: date }
        - name: checkOutDate
          in: query
          schema: { type: string, format: date }
        - name: guests
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Matching hotels
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Hotel' }
        '400':
          description: Invalid search parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /hotels/{hotelId}/rooms:
    get:
      operationId: listHotelRooms
      summary: Rooms available at a hotel for the given dates
      security:
        - oauth2: [hotels:search]
      parameters:
        - name: hotelId
          in: path
          required: true
          schema: { type: string }
        - name: checkInDate
          in: query
          schema: { type: string, format: date }
        - name: checkOutDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Rooms at this hotel
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Room' }
        '404':
          description: No such hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings:
    get:
      operationId: listMyBookings
      summary: The caller's own bookings
      security:
        - oauth2: [bookings:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: The caller's bookings
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyBooking
      summary: Book and pay for a room
      security:
        - oauth2: [bookings:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewBooking' }
      responses:
        '201':
          description: Booking confirmed and charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Invalid booking request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '402':
          description: Payment declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings/{bookingId}:
    get:
      operationId: getMyBooking
      summary: One of the caller's own bookings
      security:
        - oauth2: [bookings:read]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404':
          description: No such booking for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings/{bookingId}/cancel:
    post:
      operationId: cancelMyBooking
      summary: Cancel one of the caller's own bookings and refund it
      security:
        - oauth2: [bookings:cancel]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Booking cancelled and refunded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404':
          description: No such booking for this caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Booking already cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
