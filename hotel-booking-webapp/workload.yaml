apiVersion: openchoreo.dev/v1alpha1
metadata:
  name: hotel-booking-webapp

endpoints:
  - name: http
    type: HTTP
    port: 9090
    basePath: /
    visibility:
      - project
      - external

dependencies:
  endpoints:
    - component: hotel-booking-agent121-hotel-booking-agent
      name: http
      visibility: project
      envBindings:
        address: HOTEL_BOOKING_AGENT_URL
  resources:
    - ref: hotel-booking-age-c1b490fe
      envBindings:
        client_id: USER_AUTH_CLIENT_ID
        issuer: USER_AUTH_ISSUER
        jwks_url: USER_AUTH_JWKS_URL
        resource: USER_AUTH_RESOURCE
        scopes: USER_AUTH_SCOPES
